[build]
builder = "NIXPACKS"

[deploy]
healthcheckPath = "/actuator/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "pureskin-backend"

[services.variables]
PORT = "8080"
SPRING_DATASOURCE_URL = "${{DATABASE_URL}}"
SPRING_DATASOURCE_USERNAME = "${{DATABASE_USER}}"
SPRING_DATASOURCE_PASSWORD = "${{DATABASE_PASSWORD}}"
JWT_SECRET = "${{JWT_SECRET}}"
JWT_EXPIRATION_IN_MS = "86400000"
FAROTY_API_KEY = "${{FAROTY_API_KEY}}"
FAROTY_WALLET_ID = "${{FAROTY_WALLET_ID}}"
FAROTY_WITHDRAWAL_REF_ID = "${{FAROTY_WITHDRAWAL_REF_ID}}"
REDIS_URL = "${{REDIS_URL}}"
SENTRY_DSN = "${{SENTRY_DSN}}"
CORS_ALLOWED_ORIGINS = "https://pureskin-etudiant.vercel.app,https://pureskin-etudiant-98cq.vercel.app,https://pureskin-etudiant-w4ax.vercel.app,https://pureskin-etudiant-7j7e.vercel.app,https://pureskin-etudiant-olive.vercel.app"
BACKEND_PUBLIC_URL = "https://pureskin-etudiant-production-e70d.up.railway.app"
